<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VidWorld — Your World. Your Videos.</title>

<meta name="description" content="VidWorld — Your World. Your Videos. Watch, discover and share videos.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0f0f0f;
    color:#ffffff;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    background:#151515;
    border-bottom:1px solid #292929;
}

.logo{
    font-size:27px;
    font-weight:800;
    letter-spacing:-1px;
    white-space:nowrap;
}

.logo span{
    color:#ff3b30;
}

.header-center{
    width:45%;
    max-width:550px;
}

.search-box{
    display:flex;
    width:100%;
}

.search-box input{
    width:100%;

    padding:13px 18px;

    border:1px solid #3b3b3b;
    border-right:none;

    border-radius:25px 0 0 25px;

    background:#222222;
    color:#ffffff;

    font-size:15px;
    outline:none;
}

.search-box input:focus{
    border-color:#666666;
}

.search-box button{
    width:55px;

    border:none;
    border-radius:0 25px 25px 0;

    background:#292929;
    color:#ffffff;

    font-size:18px;
    cursor:pointer;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.upload-top{
    border:none;
    background:#ff3b30;
    color:#ffffff;

    padding:12px 18px;

    border-radius:25px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.upload-top:hover{
    background:#ff5148;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1200px;
    margin:auto;

    padding:30px 20px 110px;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:420px;

    display:flex;
    align-items:center;

    padding:55px;

    margin-bottom:50px;

    border-radius:30px;

    background:
        radial-gradient(circle at 80% 20%,rgba(255,59,48,.20),transparent 35%),
        linear-gradient(135deg,#251414,#171717 55%,#111111);

    border:1px solid #2b2b2b;

    overflow:hidden;
}

.hero-content{
    max-width:700px;
}

.hero-badge{
    display:inline-block;

    padding:9px 15px;

    margin-bottom:22px;

    border-radius:20px;

    background:#2a2020;

    color:#ff6b63;

    font-size:14px;
    font-weight:bold;
}

.hero h1{
    font-size:58px;
    line-height:1.05;

    letter-spacing:-2px;

    margin-bottom:22px;
}

.hero h1 span{
    color:#ff3b30;
}

.hero p{
    max-width:650px;

    color:#b9b9b9;

    font-size:19px;
    line-height:1.6;

    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.watch-button{
    border:none;

    background:#ff3b30;
    color:white;

    padding:15px 23px;

    border-radius:28px;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

.watch-button:hover{
    background:#ff5148;
}

.explore-button{
    border:1px solid #444;

    background:#222;
    color:white;

    padding:15px 23px;

    border-radius:28px;

    font-size:16px;

    cursor:pointer;
}

/* =========================
   SECTION
========================= */

.section{
    margin-bottom:50px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.section-title{
    font-size:30px;
    font-weight:800;
}

.view-all{
    color:#ff5a52;
    font-size:14px;
    cursor:pointer;
}

/* =========================
   CATEGORIES
========================= */

.categories{
    display:flex;
    gap:12px;

    overflow-x:auto;

    padding-bottom:8px;
}

.categories::-webkit-scrollbar{
    height:4px;
}

.categories::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

.category{
    flex:none;

    padding:13px 20px;

    border-radius:25px;

    background:#222;

    border:1px solid #333;

    color:#ddd;

    font-size:15px;

    cursor:pointer;
}

.category:hover{
    background:#303030;
}

.category.active{
    background:#ff3b30;
    border-color:#ff3b30;
    color:#fff;
}

/* =========================
   VIDEO GRID
========================= */

.video-grid{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:24px;
}

.video-card{
    background:#181818;

    border:1px solid #292929;

    border-radius:18px;

    overflow:hidden;

    transition:.2s;

    cursor:pointer;
}

.video-card:hover{
    transform:translateY(-3px);
    border-color:#444;
}

.thumbnail{
    width:100%;
    aspect-ratio:16/9;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    background:
        linear-gradient(135deg,#292929,#111111);
}

.thumbnail.music{
    background:
        linear-gradient(135deg,#301515,#181818);
}

.thumbnail.gaming{
    background:
        linear-gradient(135deg,#17172f,#111111);
}

.thumbnail.sports{
    background:
        linear-gradient(135deg,#13251a,#111111);
}

.play-icon{
    width:62px;
    height:62px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(255,255,255,.12);

    font-size:27px;

    backdrop-filter:blur(5px);
}

.duration{
    position:absolute;

    right:10px;
    bottom:10px;

    padding:5px 8px;

    border-radius:5px;

    background:rgba(0,0,0,.8);

    font-size:12px;
}

.video-info{
    padding:17px;
}

.video-title{
    font-size:17px;
    font-weight:bold;

    line-height:1.35;

    margin-bottom:9px;
}

.video-meta{
    color:#888;
    font-size:13px;

    line-height:1.5;
}

/* =========================
   UPLOADED VIDEOS
========================= */

#uploadedVideos{
    display:contents;
}

/* =========================
   UPLOAD MODAL
========================= */

.modal{
    display:none;

    position:fixed;
    inset:0;

    z-index:5000;

    background:rgba(0,0,0,.86);

    padding:20px;

    overflow-y:auto;
}

.modal.show{
    display:block;
}

.modal-box{
